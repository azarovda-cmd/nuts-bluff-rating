<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nuts & Bluff — Гонка за кубком</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202c4a,#090d19 70%);color:#f5f6fb;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:24px 16px 70px}.brand{letter-spacing:3px;color:#d6b977;font-weight:800;font-size:13px}.hero{margin:26px 0 18px;text-align:center}.cup{font-size:58px;filter:drop-shadow(0 0 18px #d8ad5177)}h1{font-size:32px;line-height:1.1;margin:8px 0;color:#ffe3a0}.sub{color:#aeb7ce;font-size:14px}.panel{background:#141d32dd;border:1px solid #33405d;border-radius:18px;padding:16px;margin:16px 0;box-shadow:0 10px 30px #0003}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:12px;color:#9eabc4}select{border:1px solid #44516c;background:#212d47;color:white;border-radius:10px;padding:9px;font-size:14px}.tabs{display:flex;gap:7px;margin:15px 0}.tabs button{flex:1;background:#27344f;color:#c9d4e8;border:1px solid #3b4c6b;border-radius:12px;padding:11px 3px;font-weight:700}.tabs button.active{background:linear-gradient(120deg,#b88630,#f3d28a);color:#191b27;border:0}.person{margin:15px 0 21px}.line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.name{font-weight:750}.place{display:inline-block;width:30px;color:#f5ce7b}.value{font-weight:800;color:#e9d09c}.track{height:13px;background:#29334c;border-radius:50px;overflow:hidden}.fill{height:100%;width:0;border-radius:50px;background:linear-gradient(90deg,#a67a34,#ffdc8a);transition:width .8s ease}.details{font-size:12px;color:#aeb8cd;margin-top:5px}.negative{color:#f18f9b}.footer{font-size:12px;color:#8d9bb6;text-align:center;margin-top:24px}.winner{font-weight:700;color:#f6d58c}h2{font-size:19px;margin:0 0 10px}.empty{color:#9eabc4;font-size:14px}
</style></head><body><main class="wrap"><div class="brand">♠ NUTS & BLUFF</div><section class="hero"><div class="cup">🏆</div><h1>ГОНКА ЗА КУБКОМ</h1><div class="sub">Ежемесячный рейтинг игроков · переходящий приз</div></section><section class="panel"><div class="top"><div><b>Турнирная таблица</b><div class="small">Рейтинг по чистому выигрышу</div></div><label><span class="small">Месяц </span><select id="month"></select></label></div><div class="tabs"><button data-game="all" class="active">Общий</button><button data-game="holdem">Холдем</button><button data-game="omaha">Омаха</button></div><div id="leaderboard"></div></section><section class="panel"><h2>🥇 Победители прошлых месяцев</h2><div id="winners" class="empty">Пока нет данных</div></section><div class="footer">Финиш — последний день месяца · Лидер = 100%<p>Демонстрационные результаты. Настоящие данные добавим после проверки.</p></div></main><script>
// DEMO: Replace entries with actual results. Each record is one player's net win for a game and month.
const results=[{month:'2026-11',name:'Алекс',game:'holdem',net:17500},{month:'2026-11',name:'Алекс',game:'omaha',net:-1500},{month:'2026-11',name:'Макс',game:'holdem',net:7500},{month:'2026-11',name:'Макс',game:'omaha',net:11000},{month:'2026-11',name:'Денис',game:'holdem',net:-2000},{month:'2026-11',name:'Денис',game:'omaha',net:13000},{month:'2026-11',name:'Роман',game:'holdem',net:9000},{month:'2026-11',name:'Роман',game:'omaha',net:-3000},{month:'2026-11',name:'Игорь',game:'holdem',net:2500},{month:'2026-11',name:'Игорь',game:'omaha',net:500}];
const pastWinners=[];let game='all';const month=document.getElementById('month'),board=document.getElementById('leaderboard');const months=[...new Set(results.map(r=>r.month))].sort().reverse();const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n);function monthName(s){const [y,m]=s.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}months.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=monthName(m);month.appendChild(o)});function render(){const map=new Map();results.filter(r=>r.month===month.value&&(game==='all'||r.game===game)).forEach(r=>map.set(r.name,(map.get(r.name)||0)+r.net));const sorted=[...map].sort((a,b)=>b[1]-a[1]);const leader=Math.max(0,...sorted.map(x=>x[1]));board.replaceChildren();if(!sorted.length){board.textContent='Пока нет результатов';return}sorted.forEach(([name,net],i)=>{const p=document.createElement('div');p.className='person';const line=document.createElement('div');line.className='line';const left=document.createElement('span');left.className='name';const rank=document.createElement('span');rank.className='place';rank.textContent=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;left.append(rank,document.createTextNode(name));const right=document.createElement('span');right.className='value'+(net<0?' negative':'');right.textContent=(net>0?'+':'')+fmt(net)+' ₽';line.append(left,right);const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.width=(leader>0&&net>0?100*net/leader:0)+'%';track.append(fill);const detail=document.createElement('div');detail.className='details';detail.textContent=net>0&&leader>0?`${Math.round(net/leader*100)}% от результата лидера`:net<0?'Отрицательный результат':'0%';p.append(line,track,detail);board.append(p)})}document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>{game=b.dataset.game;document.querySelectorAll('[data-game]').forEach(x=>x.classList.toggle('active',x===b));render()}));month.addEventListener('change',render);const w=document.getElementById('winners');if(pastWinners.length){w.replaceChildren();pastWinners.forEach(x=>{const d=document.createElement('p');d.className='winner';d.textContent=`🏆 ${monthName(x.month)} — ${x.name}`;w.append(d)})}render();
</script></body></html>
